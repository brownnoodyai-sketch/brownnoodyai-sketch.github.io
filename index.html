<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOODY.AI — Lakshadweep Marketplace</title>
  <meta name="description" content="NOODY.AI — Next-gen Oceanic Operations, Data & Yield. Select a Lakshadweep island, then browse services or products." />
  <meta name="robots" content="index,follow" />
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#102a35; background:#f5fbfd; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(180deg,#e4f8fc 0,#f8fcfd 38%,#fff 100%); color:#102a35; }
    .shell { width:min(1120px,calc(100% - 28px)); margin:0 auto; }
    header { padding:20px 0; }
    .brand { font-weight:900; font-size:26px; letter-spacing:-.04em; }
    .tagline { color:#607982; font-size:13px; margin-top:3px; }
    main { padding:26px 0 60px; }
    .selector { background:#fff; border:1px solid #d6e8ed; border-radius:22px; box-shadow:0 14px 40px rgba(28,77,88,.08); overflow:hidden; }
    .row { display:grid; grid-template-columns:180px 1fr; align-items:center; min-height:104px; border-bottom:1px solid #e5eff2; }
    .row:last-child { border-bottom:0; }
    .label { height:100%; display:flex; align-items:center; padding:24px 26px; font-size:13px; font-weight:900; letter-spacing:.12em; color:#607982; background:#f8fbfc; }
    .choices { display:flex; gap:10px; flex-wrap:wrap; padding:20px 24px; }
    button { font:inherit; }
    .choice { border:1px solid #cfe2e7; background:#fff; color:#17343e; padding:14px 19px; border-radius:13px; font-weight:850; cursor:pointer; transition:.16s ease; }
    .choice:hover { border-color:#84bdca; transform:translateY(-1px); }
    .choice.active { background:#0f745e; color:#fff; border-color:#0f745e; box-shadow:0 8px 18px rgba(15,116,94,.18); }
    .result { margin-top:22px; background:#fff; border:1px solid #d7e8ec; border-radius:20px; padding:28px; }
    .result small { display:block; font-weight:900; color:#6a838b; letter-spacing:.1em; text-transform:uppercase; margin-bottom:9px; }
    .result h1 { margin:0; font-size:clamp(30px,5vw,48px); letter-spacing:-.04em; }
    .result p { margin:10px 0 0; color:#58717a; line-height:1.7; max-width:760px; }
    .empty { margin-top:20px; border:1px dashed #c8dce2; background:#f9fcfd; border-radius:15px; padding:20px; color:#58717a; }
    .empty strong { display:block; color:#17343e; margin-bottom:6px; }
    footer { text-align:center; color:#6d848c; font-size:13px; padding:26px 0 40px; }
    @media (max-width:720px) {
      .row { grid-template-columns:1fr; }
      .label { min-height:auto; padding:16px 20px 8px; background:#fff; }
      .choices { padding:10px 18px 20px; }
      .choice { flex:1 1 42%; text-align:center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <div class="brand">NOODY.AI</div>
      <div class="tagline">Next-gen Oceanic Operations, Data &amp; Yield.</div>
    </div>
  </header>

  <main>
    <div class="shell">
      <div class="selector" aria-label="NOODY marketplace selector">
        <div class="row">
          <div class="label">ISLAND</div>
          <div class="choices" id="islandChoices">
            <button class="choice active" type="button" data-island="Agatti">Agatti</button>
            <button class="choice" type="button" data-island="Kadmat">Kadmat</button>
            <button class="choice" type="button" data-island="Kavaratti">Kavaratti</button>
            <button class="choice" type="button" data-island="Kalpeni">Kalpeni</button>
          </div>
        </div>

        <div class="row">
          <div class="label">PRODUCT / SERVICES</div>
          <div class="choices" id="typeChoices">
            <button class="choice active" type="button" data-kind="Services">Services</button>
            <button class="choice" type="button" data-kind="Products">Products</button>
          </div>
        </div>
      </div>

      <section class="result" aria-live="polite">
        <small id="resultLabel">Agatti • Services</small>
        <h1 id="resultTitle">Agatti Services</h1>
        <p id="resultCopy">Available service listings for Agatti will appear here.</p>
        <div class="empty">
          <strong id="emptyTitle">Agatti service catalogue</strong>
          <span id="emptyCopy">Only approved public listings will be shown here.</span>
        </div>
      </section>
    </div>
  </main>

  <footer>NOODY.AI • Lakshadweep</footer>

  <script>
    const islandButtons = [...document.querySelectorAll('[data-island]')];
    const kindButtons = [...document.querySelectorAll('[data-kind]')];
    const resultLabel = document.getElementById('resultLabel');
    const resultTitle = document.getElementById('resultTitle');
    const resultCopy = document.getElementById('resultCopy');
    const emptyTitle = document.getElementById('emptyTitle');
    const emptyCopy = document.getElementById('emptyCopy');
    let island = 'Agatti';
    let kind = 'Services';

    function render() {
      const singular = kind === 'Services' ? 'service' : 'product';
      resultLabel.textContent = `${island} • ${kind}`;
      resultTitle.textContent = `${island} ${kind}`;
      resultCopy.textContent = `Available ${kind.toLowerCase()} listings for ${island} will appear here.`;
      emptyTitle.textContent = `${island} ${singular} catalogue`;
      emptyCopy.textContent = `Only approved public ${kind.toLowerCase()} will be shown here.`;
    }

    islandButtons.forEach(button => {
      button.addEventListener('click', () => {
        island = button.dataset.island;
        islandButtons.forEach(item => item.classList.toggle('active', item === button));
        render();
      });
    });

    kindButtons.forEach(button => {
      button.addEventListener('click', () => {
        kind = button.dataset.kind;
        kindButtons.forEach(item => item.classList.toggle('active', item === button));
        render();
      });
    });
  </script>
</body>
</html>
