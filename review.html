<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>NOODY — Customer Feedback</title><style>*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;color:#15372e;background:#eff7f3;margin:0}.shell{max-width:620px;margin:30px auto;padding:24px;background:#fff;border:1px solid #dfeae5;border-radius:20px}label{display:block;margin:18px 0;font-weight:600}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #b4cdbf;border-radius:8px;width:100%;margin-top:6px}button{background:#08755c;color:#fff;font-weight:700;cursor:pointer}input[type=checkbox]{width:auto}a{color:#08755c}#status{white-space:pre-line}.error{color:#b52c3c}@media(max-width:650px){.shell{margin:16px}}</style></head><body data-state="loading"><main class="shell"><a href="./">noody.ai</a><select id="language" aria-label="Language"><option value="en">English</option><option value="ml">മലയാളം</option><option value="hi">हिन्दी</option></select><h1 data-review-copy="title"></h1><p data-review-copy="intro"></p><form id="reviewForm"><label><span data-review-copy="name"></span><input id="firstName" required maxlength="80" autocomplete="given-name"></label><label><span data-review-copy="stars"></span><select id="stars" required><option value="">—</option><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option></select></label><label><span data-review-copy="comment"></span><textarea id="comment" required maxlength="3000" rows="6"></textarea></label><label><span data-review-copy="date"></span><input id="usedOn" type="date"></label><label><input id="consent" type="checkbox"> <span data-review-copy="consent"></span></label><button id="submitReview" type="submit" data-review-copy="submit"></button></form><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="./review.mjs"></script></body></html>
