name: Public Website Enquiry & Studio Verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-website:
    name: Website-only catalogue / Studio / WhatsApp
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate website-only data, links and design
        run: |
          node --check index.mjs
          node --check item.mjs
          node --check listing.mjs
          node --check website-data.mjs
          node --check studio-builder.mjs
          node --check copy.mjs
          node --check design.mjs
          node --check designer.mjs
          node --check zip.mjs
          node --test .github/tests/website-data.test.mjs .github/tests/listing.test.mjs .github/tests/design.test.mjs
      - name: Build isolated browser runtime
        run: docker build -t noody-public-browser -f .github/tests/Dockerfile .github/tests
      - name: Verify manual catalogue, Studio and WhatsApp-only customer flow
        run: docker run --rm -v "$PWD:/website:ro" noody-public-browser
      - name: Verify live Pages website data without Core API dependency
        if: github.event_name == 'push'
        run: node .github/tests/probe.mjs
      - name: Verify published Pages assets match this commit
        if: github.event_name == 'push'
        run: node .github/tests/published.mjs
