<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NOODY.AI — Live Listing</title>
<meta name="description" content="Live NOODY.AI service or product listing from the central Lakshadweep marketplace."/>
<meta name="robots" content="index,follow"/>
<style>
:root{--sea:#08755c;--ink:#15372e;--muted:#6c8179;--line:#dfeae5;--soft:#eff7f3;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,#f3f8f5);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}a{text-decoration:none;color:inherit}.shell{width:min(920px,calc(100% - 32px));margin:auto}.nav{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:27px;font-weight:800;color:var(--sea)}.back{font-size:13px;font-weight:700;color:var(--sea)}.hero{margin:16px 0 26px;border-radius:26px;padding:34px;background:linear-gradient(135deg,#08755c,#0b9270);color:#fff}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;text-transform:uppercase;color:#d9fff2}.hero h1{font-size:clamp(34px,7vw,54px);line-height:1.06;margin:8px 0 12px}.hero p{max-width:680px;color:#e9fff7}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 14px 36px rgba(16,74,59,.07)}.panel h2{margin:0 0 12px}.meta{display:grid;gap:10px}.meta div{padding:12px 0;border-bottom:1px solid var(--line)}.meta div:last-child{border:0}.meta span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:800}.meta strong{display:block;margin-top:3px}.wa{display:flex;align-items:center;justify-content:center;margin-top:18px;padding:14px 16px;background:var(--sea);color:#fff;border-radius:999px;font-weight:800}.notice{margin-top:16px;padding:13px 14px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:13px}.error{padding:38px;text-align:center}.footer{padding:30px 0;color:var(--muted);font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero{padding:26px 22px}}
.nav{gap:12px;flex-wrap:wrap;height:auto;min-height:78px;padding:12px 0}.language{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--ink);font:inherit;font-size:12px}.language-buttons{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.language-buttons button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.language-buttons button.active{background:var(--sea);color:#fff;border-color:var(--sea)}.share,.refresh{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--sea);padding:10px 14px}.share{width:100%;margin-top:12px}.hero h1,.panel p,.meta strong{overflow-wrap:anywhere}.status{font-size:13px;color:var(--muted)}
.long-text,#itemDescription{white-space:pre-line}.detail-section{padding-top:22px;margin-top:22px;border-top:1px solid var(--line)}.detail-section h2{font-size:20px}.gallery{margin:24px 0}.gallery>img{width:100%;height:auto;max-height:500px;object-fit:contain;border-radius:16px;background:var(--soft)}.gallery-controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.gallery-controls button,.gallery-thumbs button{border:1px solid var(--line);border-radius:9px;background:white;color:var(--sea);padding:8px;cursor:pointer}.gallery-thumbs{display:flex;overflow:auto;gap:8px}.gallery-thumbs img{display:block;width:90px;height:65px;object-fit:cover;border-radius:6px}.gallery-thumbs [aria-pressed=true]{border:2px solid var(--sea)}.grid aside{align-self:start;position:sticky;top:15px}@media(max-width:720px){.grid aside{position:static}}
</style>
</head>
<body data-state="loading">
<div class="shell">
<header class="nav"><a class="brand" href="/">noody.ai</a><a data-copy="back" class="back" href="/">← Back to islands</a><div class="language-buttons" aria-label="Website language"><button type="button" data-language="en">English</button><button type="button" data-language="hi">हिन्दी</button><button type="button" data-language="ml">മലയാളം</button></div><select class="language" id="language" aria-label="Website language" hidden><option value="en">English</option><option value="ml">മലയാളം</option><option value="hi">हिन्दी</option></select><button class="refresh" id="refresh" type="button" data-copy="refresh">Refresh</button></header>
<main id="app"><div class="panel error">Loading live listing…</div></main>
<footer class="footer">NOODY.AI — Next-gen Oceanic Operations, Data &amp; Yield. <a href="./privacy.html" data-copy="privacy">Privacy policy</a></footer>
</div>
<script type="module" src="./item.mjs"></script>
</body>
</html>
